name: Facebook picture post

# Posts one picture and its caption (files in the repo) to a channel's
# Facebook Page at once, e.g. a Page's welcome picture. Posting stays on
# GitHub with everything else. See scripts/facebook_picture_post.py.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel id (its Facebook Page must be connected and sent to GitHub)"
        default: "motivation"
      image:
        description: "Picture in the repo"
        default: "data/page_posts/welcome_motivation.jpg"
      caption:
        description: "Caption text file in the repo"
        default: "data/page_posts/welcome_motivation.txt"

permissions:
  contents: read

concurrency:
  group: facebook-picture-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Restore the bot's state
        run: |
          set -e
          git fetch --depth=1 origin bot-state
          git archive origin/bot-state | tar -x -C .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: Restore private files
        env:
          BOT_SECRETS_B64: ${{ secrets.BOT_SECRETS_B64 }}
        run: python scripts/ci_secrets.py unpack

      - name: Post to Facebook
        run: >-
          python scripts/facebook_picture_post.py
          --channel "${{ github.event.inputs.channel }}"
          --image "${{ github.event.inputs.image }}"
          --caption "${{ github.event.inputs.caption }}"
